<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未央 Radar · 手机连接</title><link rel="icon" href="/radar-icon-192.png"><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/manifest.webmanifest"></head>
<body><main><section class="panel"><p class="eyebrow">未央 RADAR</p><h1>手机连接</h1><p>手机和电脑连接同一个 Wi-Fi，在电脑的“手机连接”窗口查看访问口令。</p><form method="post" action="/login"><label>10 位访问口令<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{10}" minlength="10" maxlength="10" autocomplete="current-password" required autofocus></label><button type="submit">进入研究库</button></form><p>此入口使用局域网 HTTP，仅在自己信任的 Wi-Fi 下使用。电脑需保持运行；连接窗口重启后需重新输入口令。</p></section></main></body>
</html>
